# Sakana-v2-like search keys remain the outer vocabulary. Harness-specific
# invariants live under harness_semantics and are not runtime-overridable.

agent:
  num_workers: 3
  steps: 12
  num_seeds: 3

search:
  max_depth: 5
  max_debug_depth: 2
  debug_prob: 0.25
  num_drafts: 3
  sunk_cost_policy: progress_gated
  scaleup_policy: disallow_by_default
  scaleup_requires:
    - root_goal_contains_efficiency_or_scale
    - current_branch_has_positive_signal
    - failure_memory_controls_are_addressed

stage_configs:
  ideation:
    enabled: true
  experimentation:
    enabled: true
  writeup:
    enabled: true
  rebuttal:
    enabled: true
  # AgentManager (Sakana-mirror) claim-typed stages. max_iterations / num_workers
  # default to agent.steps / agent.num_workers when unset.
  scope_pinning:
    max_iterations: 4
    num_workers: 1
  baseline_evidence:
    max_iterations: 6
    num_workers: 2
  mechanism_or_necessity:
    max_iterations: 6
    num_workers: 2
  boundary_ablation:
    max_iterations: 4
    num_workers: 2

harness_semantics:
  require_claim_contract: true
  baseline_policy: web_current_best_naive_random
  worker_scope_policy: no_self_expansion
  critic_governance: deterministic_folder_routing
  lesson_policy: always_include_active_one_line_lessons
  publication_gate: rebuttal_then_ac
