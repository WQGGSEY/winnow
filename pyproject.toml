[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "research-harness"
version = "0.1.0"
description = "Research prototype for evidence-governed experiments with bounded Codex workers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "research_harness/frontend/static/htmx.LICENSE"]
requires-python = ">=3.11"
dependencies = ["pyflakes>=3.4,<4"]

[project.urls]
Repository = "https://github.com/WQGGSEY/research_harness"
Issues = "https://github.com/WQGGSEY/research_harness/issues"

[project.optional-dependencies]
frontend = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.7",
]
test = [
  "pytest>=9.0,<10",
  "matplotlib>=3.11,<4",
  "httpx2>=2.9,<3",
  "PyYAML>=6.0,<7",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.7",
]

[project.scripts]
research-harness-demo = "research_harness.orchestrator.demo:main"

[tool.setuptools.packages.find]
include = ["research_harness*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"research_harness.frontend" = [
  "templates/*.html",
  "templates/phases/*.html",
  "static/*",
]
"research_harness.memory" = [
  "baseline_dossiers/*.yaml",
  "baseline_dossiers/candidates/*.md",
  "default_failures/*.yaml",
  "default_failures/*/*.md",
]
"research_harness.schemas" = ["*.schema.json"]
"research_harness.publishing" = ["venue_templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
