[project]
name = "research-harness"
version = "0.1.0"
description = "Greenfield-compatible Sakana v2 style research harness scaffold for bounded Claude Code workers."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
frontend = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.7",
]
# ADR 0010 (TRACK 1): the OFFLINE atlas build only. These are never imported by
# the air-gapped harness (which reads only a pinned, calibration-passed atlas
# artifact); they are needed solely to harvest concepts and MEASURE co-deployment
# distance offline. Keeps the core stdlib-first (dependencies = []).
atlas-builder = [
  "requests>=2.31",
  "numpy>=1.26",
]

[project.scripts]
research-harness-demo = "research_harness.orchestrator.demo:main"

[tool.setuptools.packages.find]
include = ["research_harness*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"research_harness.frontend" = [
  "templates/*.html",
  "templates/phases/*.html",
  "static/*",
]
"research_harness.schemas" = ["*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

