query: "GEPA LLM gradient flow automated WorldQuant Brain expression alpha generation dataset selection"
problem_scope:
  domain: "automated_expression_alpha_generation"
  node_type: "validity"
  claim_under_test: "It is possible to solve the problem of building an automated pipeline that generates WorldQuant Brain\u2013style expression alphas using a GEPA-style LLM-based gradient-flow methodology, where the pipeline also automatically selects which datasets/fields/categories to use from the millions of available WQ data fields (guided by metadata such as description, type, and per-dataset count of alphas in the WQ submitted alpha pool, while avoiding both over-used fields that fail correlation checks and under-used fields with no signal), given 8 years of data across 3000 stocks, evaluated in a self-built simulator during research and on the WorldQuant Brain simulator at production stage, and respecting WorldQuant Brain alpha submission constraints."
