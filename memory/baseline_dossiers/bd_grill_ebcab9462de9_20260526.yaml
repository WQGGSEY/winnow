query: "detecting data mining vs genuine nonlinear predictive signal in machine-generated alpha factors pre out-of-sample"
problem_scope:
  domain: "machine_alpha_signal_vs_datamining_discrimination"
  node_type: "validity"
  claim_under_test: "It is possible to solve the problem of pre-OOS discrimination of whether a given machine-generated alpha (produced by ML, genetic programming, random expression dumping, or any other automated alpha-search procedure over the WorldQuant data universe of millions of daily features across multiple regions and asset classes) has captured a genuine nonlinear future-return signal latent in the input data, versus being a data-mining artifact that only appears strong in-sample, by inspecting the alpha itself (its expression/model, the data it uses, and its IS performance) and producing a verdict/score \u2014 without relying on distribution-shift considerations, which are out of scope."
